<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌸 IMC Suave</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-body);
            color: var(--text-primary);
            padding-top: 72px;
            /* espaço para navbar fixa */
        }

        /* ===== VARIÁVEIS ===== */
        :root {
            --bg-body: #f0f4fa;
            --bg-nav: #ffffffcc;
            --bg-card: #ffffffdd;
            --bg-input: #f8faff;
            --text-primary: #2c3e50;
            --text-secondary: #4a5f73;
            --border-soft: #d4e0ed;
            --shadow-soft: 0 8px 32px rgba(0, 20, 40, 0.08);
            --accent: #6c8eb2;
            --accent-hover: #5a7a9e;
            --glow: #a0c0dd66;
            --whatsapp: #25d366;
        }

        [data-theme="dark"] {
            --bg-body: #1a2330;
            --bg-nav: #1e2a3acc;
            --bg-card: #232f3fdd;
            --bg-input: #2a3749;
            --text-primary: #e8edf2;
            --text-secondary: #b0c4db;
            --border-soft: #3a4a62;
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.4);
            --accent: #8aafd4;
            --accent-hover: #a8c8e8;
            --glow: #6c8eb266;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--bg-nav);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-soft);
            box-shadow: var(--shadow-soft);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        .navbar.hidden {
            transform: translateY(-100%);
            opacity: 0;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 6px 2px;
            border-bottom: 2px solid transparent;
            transition: 0.25s;
        }

        .nav-links a:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* ===== BOTÕES NAV ===== */
        .btn-icon {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 40px;
            transition: 0.2s;
            color: var(--text-secondary);
        }

        .btn-icon:hover {
            background: var(--border-soft);
            transform: scale(1.05);
        }

        .btn-tts {
            font-size: 1.2rem;
        }

        .btn-theme {
            font-size: 1.3rem;
        }

        /* ===== WHATSAPP FLOATING ===== */
        .whatsapp-float {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            background: var(--whatsapp);
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            text-decoration: none;
            box-shadow: 0 6px 24px rgba(37, 211, 102, 0.4);
            transition: 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .whatsapp-float:hover {
            transform: scale(1.1) rotate(-6deg);
            box-shadow: 0 8px 32px rgba(37, 211, 102, 0.6);
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            flex: 1;
            max-width: 520px;
            margin: 20px auto 40px;
            padding: 0 20px;
            width: 100%;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 36px 28px;
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-soft);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-primary);
        }

        .sub {
            text-align: center;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 0.9rem;
            margin-top: -4px;
        }

        .input-group {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
        }

        .input-group input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            background: var(--border-soft);
            height: 6px;
            border-radius: 20px;
            margin-top: 4px;
            cursor: pointer;
        }

        .input-group input[type="number"] {
            background: var(--bg-input);
            border: 2px solid var(--border-soft);
            border-radius: 60px;
            padding: 12px 18px;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: 0.3s;
            font-weight: 500;
            width: 100%;
        }

        .input-group input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--glow);
        }

        .double-input {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .double-input .input-group {
            flex: 1;
            margin-top: 0;
        }

        .btn-calcular {
            margin-top: 28px;
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 16px var(--glow);
        }

        .btn-calcular:hover {
            background: var(--accent-hover);
            transform: scale(1.01);
            box-shadow: 0 6px 24px var(--glow);
        }

        /* ===== RESULTADO ===== */
        #resultado {
            margin-top: 28px;
            background: var(--bg-input);
            border-radius: 32px;
            padding: 24px 20px;
            border-left: 6px solid var(--accent);
            min-height: 100px;
        }

        #resultado .imc {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        #resultado .classif {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        #resultado .msg {
            margin-top: 12px;
            font-size: 1rem;
            opacity: 0.8;
            border-top: 1px solid var(--border-soft);
            padding-top: 12px;
            color: var(--text-secondary);
        }

        .historico {
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            max-height: 100px;
            overflow-y: auto;
            border-top: 1px solid var(--border-soft);
            padding-top: 14px;
        }

        .historico span {
            display: inline-block;
            background: var(--bg-input);
            padding: 4px 16px;
            border-radius: 40px;
            margin: 4px 6px 4px 0;
            border: 1px solid var(--border-soft);
            font-size: 0.8rem;
        }

        /* ===== RODAPÉ ===== */
        footer {
            margin-top: auto;
            background: var(--bg-nav);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-soft);
            padding: 20px 24px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        footer strong {
            color: var(--accent);
            font-weight: 600;
        }

        /* ===== SCROLL ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 20px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .navbar {
                padding: 0 16px;
                height: 58px;
            }
            .nav-links {
                gap: 14px;
            }
            .nav-links a {
                font-size: 0.8rem;
            }
            .nav-logo {
                font-size: 1.1rem;
            }
            .btn-icon {
                font-size: 1.1rem;
                padding: 4px 6px;
            }
            .container {
                padding: 0 12px;
            }
            .card {
                padding: 24px 16px;
            }
            .double-input {
                flex-direction: column;
                gap: 8px;
            }
            .whatsapp-float {
                width: 52px;
                height: 52px;
                font-size: 2rem;
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-logo">🌸 IMC</div>
        <ul class="nav-links">
            <li><a href="#">Início</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Login</a></li>
        </ul>
        <div class="nav-actions">
            <button class="btn-icon btn-tts" id="ttsBtn" title="Ler resultado">🔊</button>
            <button class="btn-icon btn-theme" id="themeBtn" title="Alternar tema">🌙</button>
        </div>
    </nav>

    <!-- ===== WHATSAPP ===== -->
    <a href="https://wa.me/5511999999999?text=Olá!%20Quero%20saber%20meu%20IMC!" target="_blank" class="whatsapp-float" title="Fale conosco no WhatsApp">
        💬
    </a>

    <!-- ===== CONTEÚDO ===== -->
    <div class="container">
        <div class="card">
            <h1>🌿 IMC Suave</h1>
            <div class="sub">calcule com calma 🌊</div>

            <div class="double-input">
                <div class="input-group">
                    <label>📏 Altura (m) <span id="alturaValor">1.75</span></label>
                    <input type="range" id="alturaSlider" min="1.00" max="2.50" step="0.01" value="1.75" />
                    <input type="number" id="alturaInput" step="0.01" value="1.75" />
                </div>
                <div class="input-group">
                    <label>⚖️ Peso (kg) <span id="pesoValor">70</span></label>
                    <input type="range" id="pesoSlider" min="20" max="200" step="1" value="70" />
                    <input type="number" id="pesoInput" step="1" value="70" />
                </div>
            </div>

            <button class="btn-calcular" id="calcularBtn">✨ Calcular</button>

            <div id="resultado">
                <div class="imc" id="imcDisplay">--</div>
                <div class="classif" id="classifDisplay">Aguardando...</div>
                <div class="msg" id="msgDisplay">💭 preencha os dados e clique</div>
            </div>

            <div class="historico" id="historicoDisplay">📋 histórico:</div>
        </div>
    </div>

    <!-- ===== RODAPÉ ===== -->
    <footer>
        <strong>Rodrigues Siquisse</strong> &nbsp;·&nbsp; <span id="footerDate"></span>
    </footer>

    <script>
        // ===== ELEMENTOS =====
        const navbar = document.getElementById('navbar');
        const alturaSlider = document.getElementById('alturaSlider');
        const pesoSlider = document.getElementById('pesoSlider');
        const alturaInput = document.getElementById('alturaInput');
        const pesoInput = document.getElementById('pesoInput');
        const alturaValor = document.getElementById('alturaValor');
        const pesoValor = document.getElementById('pesoValor');
        const calcularBtn = document.getElementById('calcularBtn');
        const imcDisplay = document.getElementById('imcDisplay');
        const classifDisplay = document.getElementById('classifDisplay');
        const msgDisplay = document.getElementById('msgDisplay');
        const historicoDisplay = document.getElementById('historicoDisplay');
        const ttsBtn = document.getElementById('ttsBtn');
        const themeBtn = document.getElementById('themeBtn');
        const footerDate = document.getElementById('footerDate');

        let historico = [];
        let lastIMC = null;
        let lastClassif = '';

        // ===== DATA RODAPÉ =====
        const agora = new Date();
        const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        footerDate.textContent = `${agora.getFullYear()} · ${meses[agora.getMonth()]} ${agora.getDate()}`;

        // ===== SINCRONIZA SLIDERS + INPUTS =====
        function sincronizar() {
            const a = parseFloat(alturaSlider.value);
            const p = parseFloat(pesoSlider.value);
            alturaValor.textContent = a.toFixed(2);
            pesoValor.textContent = p;
            alturaInput.value = a.toFixed(2);
            pesoInput.value = p;
        }

        alturaSlider.addEventListener('input', sincronizar);
        pesoSlider.addEventListener('input', sincronizar);

        alturaInput.addEventListener('input', () => {
            let val = parseFloat(alturaInput.value);
            if (!isNaN(val) && val >= 1.0 && val <= 2.5) {
                alturaSlider.value = val;
                alturaValor.textContent = val.toFixed(2);
            }
        });

        pesoInput.addEventListener('input', () => {
            let val = parseFloat(pesoInput.value);
            if (!isNaN(val) && val >= 20 && val <= 200) {
                pesoSlider.value = val;
                pesoValor.textContent = val;
            }
        });

        // ===== CLASSIFICAÇÃO =====
        function classificarIMC(imc) {
            if (imc < 16) return { class: 'Magreza grave', msg: 'Procure um médico com carinho ❤️', emoji: '🫂' };
            if (imc < 17) return { class: 'Magreza moderada', msg: 'Que tal um acompanhamento nutricional?', emoji: '🥑' };
            if (imc < 18.5) return { class: 'Magreza leve', msg: 'Cuide da sua alimentação com afeto', emoji: '🌱' };
            if (imc < 25) return { class: 'Saudável', msg: 'Você está no caminho! ✨', emoji: '🌟' };
            if (imc < 30) return { class: 'Sobrepeso', msg: 'Vamos dar um passeio? 🚶', emoji: '🌊' };
            if (imc < 35) return { class: 'Obesidade grau I', msg: 'Busque apoio, você merece cuidado', emoji: '🤗' };
            if (imc < 40) return { class: 'Obesidade grau II', msg: 'Hora de dar um passo com carinho', emoji: '🌿' };
            return { class: 'Obesidade grau III', msg: 'Você é importante, procure ajuda ❤️', emoji: '🫂' };
        }

        // ===== CALCULAR =====
        function calcularIMC() {
            const altura = parseFloat(alturaSlider.value);
            const peso = parseFloat(pesoSlider.value);

            if (!altura || !peso || altura <= 0 || peso <= 0) {
                imcDisplay.textContent = '❌';
                classifDisplay.textContent = 'Dados inválidos';
                msgDisplay.textContent = 'Coloque valores positivos, amigo';
                return;
            }

            const imc = peso / (altura * altura);
            const imcFormatado = imc.toFixed(2);
            const info = classificarIMC(imc);

            lastIMC = imcFormatado;
            lastClassif = `${info.emoji} ${info.class}`;

            imcDisplay.textContent = `${info.emoji} ${imcFormatado}`;
            classifDisplay.textContent = info.class;
            msgDisplay.textContent = info.msg;

            // histórico
            const registro = `${imcFormatado} — ${info.class}`;
            historico.unshift(registro);
            if (historico.length > 10) historico.pop();

            let html = '📋 histórico: ';
            historico.forEach(item => {
                html += `<span>${item}</span>`;
            });
            historicoDisplay.innerHTML = html;
        }

        calcularBtn.addEventListener('click', calcularIMC);
        alturaInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') calcularIMC(); });
        pesoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') calcularIMC(); });

        // ===== TTS - LEITURA =====
        ttsBtn.addEventListener('click', () => {
            if (!lastIMC) {
                alert('Calcule seu IMC primeiro! 😊');
                return;
            }
            const texto = `Seu IMC é ${lastIMC}. Classificação: ${lastClassif}. ${msgDisplay.textContent}`;
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            speechSynthesis.speak(utterance);
        });

        // ===== TEMA ESCURO/CLARO =====
        let darkMode = false;
        themeBtn.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            themeBtn.textContent = darkMode ? '☀️' : '🌙';
        });

        // ===== NAVBAR SOME AO ROLAR =====
        let lastScrollY = window.scrollY;
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY && currentScrollY > 60) {
                navbar.classList.add('hidden');
            } else {
                navbar.classList.remove('hidden');
            }
            lastScrollY = currentScrollY;
        });

        // ===== INICIAL =====
        sincronizar();
    </script>
</body>
</html>
